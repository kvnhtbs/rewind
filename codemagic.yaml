# REWIND · Codemagic CI/CD
# Workflow activo: compilación SIN firma (no necesita cuenta de Apple Developer).
# Workflow comentado al final: IPA firmado (descomentar cuando tengas firma configurada).

workflows:
  rewind-unsigned:
    name: REWIND - Compilación sin firma
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest            # Xcode estable más reciente de Codemagic (el proyecto exige iOS 17+)
      vars:
        XCODE_PROJECT: "REWIND.xcodeproj"
        XCODE_SCHEME: "REWIND"
    scripts:
      - name: Versiones de herramientas
        script: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Comprobar estructura del proyecto
        script: |
          set -e
          mkdir -p build
          xcodebuild -list -project "$XCODE_PROJECT"

      - name: Compilar para simulador iOS (sin firma)
        script: |
          set -o pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData-sim \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build/xcodebuild-simulator.log

      - name: Compilar para dispositivo (sin firma) y empaquetar IPA sin firmar
        script: |
          set -o pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/xcodebuild-device.log
          APP_PATH=$(find build/DerivedData-device/Build/Products -maxdepth 3 -name "REWIND.app" | head -n 1)
          test -n "$APP_PATH" || { echo "No se encontró REWIND.app"; exit 1; }
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          (cd build/ipa && zip -qry REWIND-unsigned.ipa Payload && rm -rf Payload)
          ls -la build/ipa

    artifacts:
      - build/ipa/*.ipa            # IPA SIN firmar: demuestra que compila, NO se puede instalar en un iPhone
      - build/*.log                # Logs completos de xcodebuild

